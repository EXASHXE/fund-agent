name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # ── Incremental Ruff Gate (v0.10.4) ──────────────────────────────────
      # Only checks paths that are clean under v0.10.4 standards.
      # Legacy paths outside this scope have ~626 pre-existing violations
      # tracked in tech-debt issue. Do NOT expand scope without fixing
      # those violations first. See docs/debt/incremental-ruff-gate.md.
      - name: Ruff check (incremental gate)
        run: |
          ruff check \
            src/host_data/ \
            src/skills_runtime/workflow/final_report.py \
            src/tools/adapters/ \
            src/tools/evidence/ \
            src/tools/portfolio/report_sections/render.py \
            tests/host_adapters/ \
            tests/release/test_v010_release_consistency.py \
            tests/schemas/test_provider_data_snapshot_schema.py \
            tests/scripts/ \
            tests/workflow/test_portfolio_input_bridge.py \
            tests/tools/portfolio/
      - name: Run tests with coverage
        run: PYTHONPATH=. pytest --cov=src -q
      - name: Type check (non-blocking)
        run: mypy src/
        continue-on-error: true
      - name: Run canonical plugin gate
        run: bash scripts/check_plugin_gate.sh
      - name: Architecture boundary tests
        run: PYTHONPATH=. pytest tests/architecture -q
      - name: Contract tests
        run: PYTHONPATH=. pytest tests/contracts -q
