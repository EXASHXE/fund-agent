[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-agent"
version = "0.10.5"
description = "Host-agnostic AI financial research skill pack / agent plugin"
requires-python = ">=3.11"

[project.scripts]
fund-agent = "fund_agent.cli:main"
fund-agent-run-skill = "src.skillpack.run_skill:main"
fund-agent-doctor = "src.skillpack.doctor:main"

[tool.pytest.ini_options]
testpaths = [
    "tests/architecture",
    "tests/contracts",
    "tests/skillpack",
    "tests/skills_runtime",
    "tests/skills",
    "tests/tools",
    "tests/integration",
    "tests/ci",
    "tests/docs",
    "tests/golden",
    "tests/install",
    "tests/runtime_bridge",
    "tests/personal_regression",
    "tests/scripts",
    "tests/workflow",
    "tests/host_data",
    "tests/public_api",
    "tests/release",
    "tests/agent_wrappers",
    "tests/privacy",
    "tests/end_to_end",
]
pythonpath = ["."]
addopts = "--import-mode=importlib"

markers = [
    "plugin: host-agnostic plugin core tests",
    "contract: schema and runtime contract tests",
    "architecture: boundary and dependency tests",
    "deprecated: optional historical or reference workflow tests",
    "slow: slow end-to-end or broad smoke tests",
    "subprocess: tests that spawn Python/Node/npm subprocesses",
    "install: packaging/install smoke tests",
    "golden: golden snapshot comparison or snapshot scanning tests",
    "smoke: broad external-host smoke tests",
    "filesystem: tests that scan many files",
    "windows_slow: tests known to be slower on Windows",
    "live_provider: tests requiring live provider access (skipped by default)",
    "adapter_live: tests requiring real adapter dependency and/or network (skipped by default)",
    "adapter: adapter-specific tests",
    "regression: personal regression tests",
    "unit: pure fast unit tests",
    "integration: multi-module integration tests",
    "e2e: synthetic end-to-end tests",
    "release: release-freeze gate tests",
    "real_e2e: requires private local data, never run in CI by default",
    "privacy: privacy / artifact safety checks",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pytest-xdist>=3.5",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]  # line too long — handled by line-length

[tool.ruff.lint.isort]
known-first-party = ["src", "fund_agent"]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "legacy/",
    "tests/",
]

[tool.setuptools.packages.find]
include = ["src*", "fund_agent*"]
